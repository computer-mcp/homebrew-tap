name: Update published releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: update-published-releases
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'computer-mcp/homebrew-tap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.releases.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s Tests
      - name: Validate published product releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py prepare
      - if: steps.releases.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/updates.json
          if-no-files-found: error

  stage:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate
      - name: Stage Formula and Cask updates
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Formula/
            Casks/
            Metadata/
          if-no-files-found: error

  propose:
    needs: stage
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      BRANCH: automation/distribution-updates
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Check published asset identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py check
      # Pull requests opened with the workflow token wait for manual approval before their checks
      # run, so the proposal and its pull request use the automation App's installation token.
      - name: Create automation token
        id: automation
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - name: Propose verified distribution files
        id: proposal
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
        run: |
          for package_directory in Formula Casks Metadata; do
            if [[ -d "$package_directory" ]]; then git add -- "$package_directory"; fi
          done
          python3 -B Scripts/release_updates.py propose --branch "$BRANCH"
      - name: Merge the proposal once its checks pass
        if: steps.proposal.outputs.title != ''
        env:
          GH_TOKEN: ${{ steps.automation.outputs.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TITLE: ${{ steps.proposal.outputs.title }}
        run: |
          body="Generated from published releases by [the release update workflow]($RUN_URL). Source tags, artifact digests, acceptance records and published identities were verified before this proposal. The pull request merges automatically once the required brew test-bot checks pass."
          number=$(gh pr list --head "$BRANCH" --base master --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            gh pr edit "$number" --title "$TITLE" --body "$body"
          else
            number=$(gh pr create --head "$BRANCH" --base master --title "$TITLE" --body "$body" | sed 's#.*/##')
          fi
          if [[ "$(gh pr view "$number" --json autoMergeRequest --jq '.autoMergeRequest == null')" == true ]]; then
            gh pr merge "$number" --auto --squash
          fi
