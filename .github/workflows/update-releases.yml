name: Update published releases

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: update-published-releases
  cancel-in-progress: false

jobs:
  discover:
    if: github.repository == 'computer-mcp/homebrew-tap'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.releases.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B -m unittest discover -s Tests
      - name: Validate published product releases
        id: releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py prepare
      - if: steps.releases.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate/updates.json
          if-no-files-found: error

  stage:
    needs: discover
    if: needs.discover.outputs.changed == 'true'
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # main
        with:
          token: ${{ github.token }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-inputs-${{ github.run_id }}-${{ github.run_attempt }}
          path: .candidate
      - name: Stage Formula and Cask updates
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            Formula/
            Casks/
            Metadata/
          if-no-files-found: error

  verify:
    needs: stage
    uses: ./.github/workflows/tests.yml
    with:
      candidate-artifact: distribution-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read

  publish:
    needs: [stage, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distribution-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Check published asset identities
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -B Scripts/release_updates.py check
      - name: Commit verified distribution files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for package_directory in Formula Casks Metadata; do
            if [[ -d "$package_directory" ]]; then git add -- "$package_directory"; fi
          done
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update verified Homebrew distributions'
          git push origin HEAD:master
